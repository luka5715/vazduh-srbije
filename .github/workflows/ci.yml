# CI za „Vazduh Srbije“ (Microsoft Fabric App, Rayfin SDK).
# Provere koje ne zahtevaju Fabric nalog ni tajne: tipovi, lint, testovi, build funkcija i demo build
# frontenda (VITE_SERVICE_MODE=demo ne dodiruje backend).
# Deploy u Fabric namerno NIJE ovde – zahteva service principal i tajne tenanta
# (vidi Fabric dokumentaciju „Deploy a Fabric app with GitHub Actions“).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rayfin/functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: rayfin/functions

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build functions
        run: npm run functions:build

      - name: Build demo frontend (no Fabric backend)
        run: npm run build:demo
